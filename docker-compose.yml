version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    # Traefik disabled ports due to API bug
    ports:
      - "8890:80"
      - "8444:443"
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - BACKEND_URL=http://backend:8002
    container_name: shloka_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8002/api/v1
      - BACKEND_URL=http://backend:8002
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=development_secret_key_123
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
      - "3001:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend/app
    container_name: shloka_backend
    ports:
      - "8002:8002"
    restart: unless-stopped
    depends_on:
      - postgres
      - neo4j
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NLP_SERVICE_URL=http://sanskrit_processor:8001
      - NER_SERVICE_URL=http://entity_extractor:8003
      - GRAPH_SERVICE_URL=http://graph_builder:8004
      - API_SECRET_KEY=${API_SECRET_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8002"

  sanskrit_processor:
    build:
      context: ./backend/services/sanskrit_processor
    container_name: shloka_sanskrit_processor
    restart: unless-stopped
    environment:
      - API_SECRET_KEY=${API_SECRET_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]

  entity_extractor:
    build:
      context: ./backend/services/entity_extractor
    container_name: shloka_entity_extractor
    restart: unless-stopped
    environment:
      - API_SECRET_KEY=${API_SECRET_KEY}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8003"]

  graph_builder:
    build:
      context: ./backend/services/graph_builder
    container_name: shloka_graph_builder
    restart: unless-stopped
    environment:
      - API_SECRET_KEY=${API_SECRET_KEY}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8004"]

  postgres:
    image: pgvector/pgvector:pg16
    container_name: shloka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shloka_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  neo4j:
    image: neo4j:5
    container_name: shloka_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_listen__address: 0.0.0.0:7474
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
  redis_data: